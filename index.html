<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Papan Bintang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --malam:#141a45; --nila:#252b6b; --nila-terang:#333a8c;
  --bintang:#ffc93c; --jingga:#ff7b3d; --daun:#35d9a1; --merah-muda:#ff8fb1;
  --susu:#fff6e6; --kabur:rgba(255,246,230,.55);
  --pad:3.5vmin; --r:2.2vmin;
}
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 700px at 15% -10%, #2b2f7a 0%, transparent 60%),
    radial-gradient(900px 600px at 95% 110%, #3d2a6b 0%, transparent 55%),
    var(--malam);
  color:var(--susu); font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
#langit{position:fixed;inset:0;pointer-events:none;z-index:0}
#langit i{position:absolute;background:#fff;border-radius:50%;opacity:.5;animation:kedip 4s infinite ease-in-out}
@keyframes kedip{0%,100%{opacity:.15}50%{opacity:.7}}

.halaman{position:fixed;inset:0;z-index:5;display:none}
.halaman.aktif{display:block}
.halaman-tengah{width:100%;height:100%;display:grid;place-items:center;padding:4vmin;overflow:auto;position:relative;z-index:1}
.kotak-halaman{width:min(120vmin,92vw);max-height:92vh;overflow:auto;background:linear-gradient(170deg,var(--nila-terang),var(--nila));
  border-radius:calc(var(--r)*1.4);padding:4vmin;text-align:center;box-shadow:inset 0 0 0 .35vmin rgba(255,246,230,.08), 0 2vmin 6vmin rgba(0,0,0,.4);position:relative}
.kotak-halaman h1{font-family:"Fredoka",sans-serif;font-weight:600;font-size:4.4vmin;margin-bottom:1vmin}
.kotak-halaman p.sub{color:var(--kabur);font-weight:700;font-size:2vmin;margin-bottom:3.4vmin}

.tab-gender{display:flex;justify-content:center;gap:1.4vmin;margin-bottom:2.6vmin}
.tab-gender button{font-family:"Fredoka",sans-serif;font-size:2.2vmin;font-weight:600;padding:1.3vmin 3.4vmin;
  border-radius:99px;border:.25vmin solid rgba(255,246,230,.18);background:rgba(255,246,230,.06);color:var(--susu);cursor:pointer;transition:.15s}
.tab-gender button.aktif{background:var(--bintang);color:#3a2a00;border-color:var(--bintang)}

.grid-avatar{display:grid;grid-template-columns:repeat(4,1fr);gap:1.8vmin;margin-bottom:3.4vmin}
.pilihan-avatar{aspect-ratio:1;border-radius:50%;border:.3vmin solid rgba(255,246,230,.14);background:rgba(255,246,230,.06);
  font-size:6vmin;display:grid;place-items:center;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
.pilihan-avatar:hover,.pilihan-avatar:focus-visible{border-color:rgba(255,201,60,.5);outline:none}
.pilihan-avatar.pilih{border-color:var(--bintang);background:rgba(255,201,60,.2);transform:scale(1.08)}

.baris-input-onboard{display:flex;gap:1.6vmin;justify-content:center;flex-wrap:wrap;margin-bottom:3.4vmin}
.kolom-input{display:flex;flex-direction:column;gap:.7vmin;align-items:flex-start}
.kolom-input label{font-size:1.7vmin;font-weight:900;color:var(--kabur);text-transform:uppercase;letter-spacing:.08em}
.baris-input-onboard input{font-family:inherit;font-size:2.4vmin;font-weight:700;color:var(--susu);background:rgba(0,0,0,.28);
  border:.25vmin solid rgba(255,246,230,.18);border-radius:1.2vmin;padding:1.6vmin 2vmin;text-align:center}
.baris-input-onboard input:focus{outline:.3vmin solid var(--bintang)}
#in-onboard-nama{width:30vmin}
#in-onboard-usia{width:18vmin}

.tombol-besar{font-family:"Fredoka",sans-serif;font-weight:600;font-size:2.6vmin;padding:1.8vmin 5.4vmin;
  border-radius:1.6vmin;border:0;background:var(--bintang);color:#3a2a00;cursor:pointer;transition:transform .15s}
.tombol-besar:disabled{opacity:.35;cursor:not-allowed}
.tombol-besar:not(:disabled):hover{transform:scale(1.04)}
.tombol-kecil-atas{position:absolute;top:1.6vmin;right:1.6vmin;width:5vmin;height:5vmin;border-radius:50%;
  background:rgba(255,246,230,.1);border:0;color:var(--susu);font-size:2.2vmin;display:none;place-items:center;cursor:pointer}
.tombol-kecil-atas.tampak{display:grid}

.grid-hadiah{display:grid;grid-template-columns:repeat(2,1fr);gap:2vmin;margin-bottom:3vmin}
.kartu-hadiah{position:relative;border-radius:var(--r);padding:2.6vmin 1.6vmin;background:rgba(255,246,230,.06);
  border:.3vmin solid rgba(255,246,230,.12);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1.1vmin;
  min-height:16vmin;justify-content:center;transition:.15s;font-family:inherit}
.kartu-hadiah.pilih{border-color:var(--bintang);background:rgba(255,201,60,.14);box-shadow:0 0 0 .5vmin rgba(255,201,60,.22)}
.kartu-hadiah.kosong{border-style:dashed;opacity:.75}
.kartu-hadiah .emoji-hadiah{font-size:6.4vmin;filter:drop-shadow(0 .5vmin .8vmin rgba(0,0,0,.35))}
.kartu-hadiah.kosong .emoji-hadiah{opacity:.55}
.kartu-hadiah .nama-hadiah{font-family:"Fredoka",sans-serif;font-size:2.1vmin;font-weight:600;line-height:1.2}
.kartu-hadiah .sunting{position:absolute;top:.9vmin;right:.9vmin;width:4.2vmin;height:4.2vmin;border-radius:50%;
  background:rgba(0,0,0,.35);border:0;color:var(--susu);font-size:1.9vmin;display:grid;place-items:center;cursor:pointer}
.kartu-hadiah .centang-hadiah{position:absolute;top:.9vmin;left:.9vmin;width:4.2vmin;height:4.2vmin;border-radius:50%;
  background:var(--daun);color:#0d3a2c;display:grid;place-items:center;font-weight:900;font-size:2.2vmin;
  transform:scale(0);transition:transform .2s cubic-bezier(.2,.8,.3,1.6)}
.kartu-hadiah.pilih .centang-hadiah{transform:scale(1)}

.editor-hadiah{position:fixed;inset:0;z-index:70;background:rgba(10,13,40,.86);backdrop-filter:blur(6px);display:none;place-items:center;padding:4vmin}
.editor-hadiah.tampil{display:grid}
.kotak-editor{background:var(--nila);border-radius:var(--r);padding:3.2vmin;width:min(90vmin,90vw);max-height:88vh;overflow:auto;text-align:left}
.kotak-editor h2{font-family:"Fredoka",sans-serif;font-size:2.8vmin;margin-bottom:2vmin;text-align:center}
.kotak-editor label{font-size:1.8vmin;font-weight:900;color:var(--kabur);display:block;margin-bottom:.8vmin}
#in-editor-nama,#in-aktivitas-baru-nama,#in-aktivitas-baru-kutipan{width:100%;font-family:inherit;font-size:2.2vmin;font-weight:700;color:var(--susu);background:rgba(0,0,0,.28);
  border:.25vmin solid rgba(255,246,230,.18);border-radius:1.2vmin;padding:1.4vmin 1.8vmin;margin-bottom:2.4vmin}
#in-editor-nama:focus,#in-aktivitas-baru-nama:focus,#in-aktivitas-baru-kutipan:focus{outline:.3vmin solid var(--bintang)}
.grid-emoji-pilih{display:grid;grid-template-columns:repeat(auto-fill,minmax(8vmin,1fr));gap:1.2vmin;margin-bottom:2.6vmin}
.emoji-opsi{aspect-ratio:1;border-radius:1.2vmin;border:.25vmin solid rgba(255,246,230,.14);background:rgba(255,246,230,.06);
  font-size:4vmin;display:grid;place-items:center;cursor:pointer}
.emoji-opsi.pilih{border-color:var(--bintang);background:rgba(255,201,60,.2)}

.layar{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:var(--pad) calc(var(--pad)*1.4);gap:1.6vmin}
.tombol-mengambang{position:absolute;top:1.6vmin;z-index:20;background:rgba(255,246,230,.1);border:0;color:var(--susu);cursor:pointer;
  width:6vmin;height:6vmin;border-radius:50%;font-size:2.6vmin;display:grid;place-items:center}
.tombol-mengambang.kiri{left:1.6vmin}.tombol-mengambang.kanan{right:1.6vmin}
.tombol-mengambang:hover,.tombol-mengambang:focus-visible{background:rgba(255,246,230,.22);outline:none}
#lampu-sinkron{position:absolute;right:.5vmin;bottom:.5vmin;width:1.4vmin;height:1.4vmin;border-radius:50%;background:#777;transition:background .3s}
#lampu-sinkron.aman{background:var(--daun)} #lampu-sinkron.antre{background:var(--bintang)} #lampu-sinkron.mati{background:#e0574a}

.banner-judul{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:1.6vmin;
  background:linear-gradient(135deg,#4550c9,#6d4fd6);border-radius:99px;padding:1.4vmin 4vmin;
  box-shadow:inset 0 0 0 .3vmin rgba(255,246,230,.14), 0 1vmin 2.4vmin rgba(0,0,0,.3);margin:0 auto;max-width:96%}
.banner-avatar{font-size:5vmin;flex:0 0 auto;filter:drop-shadow(0 .4vmin .6vmin rgba(0,0,0,.3))}
.banner-teks{text-align:center}
.banner-teks h1{font-family:"Fredoka",sans-serif;font-weight:600;font-size:3vmin;color:var(--bintang);line-height:1.15}
.banner-teks p{font-size:1.7vmin;color:var(--susu);font-weight:700;opacity:.85;margin-top:.3vmin}

main.papan-dua-kolom{flex:1 1 auto;display:grid;grid-template-columns:1.05fr 1fr;gap:2vmin;min-height:0}
.panel{background:rgba(255,246,230,.06);border-radius:var(--r);padding:2vmin}
.panel>h2{font-family:"Fredoka",sans-serif;font-weight:600;font-size:2.4vmin;margin-bottom:1.6vmin;color:var(--susu)}

.kolom-tugas{display:flex;flex-direction:column;min-height:0}
#papan{flex:1 1 auto;display:flex;flex-direction:column;gap:1.2vmin;overflow-y:auto;padding-right:.4vmin}
.kartu{position:relative;border:0;cursor:pointer;text-align:left;color:var(--susu);width:100%;
  background:rgba(255,246,230,.05);border-radius:1.6vmin;padding:1.4vmin 2vmin 1.4vmin 1vmin;
  display:flex;align-items:center;gap:1.6vmin;font-family:inherit;overflow:hidden;
  border-left:1vmin solid var(--warna,var(--bintang));
  transition:transform .18s cubic-bezier(.2,.8,.3,1.4), box-shadow .18s, background .3s}
.kartu .lencana{flex:0 0 auto;width:4.2vmin;height:4.2vmin;border-radius:50%;background:var(--warna,var(--bintang));color:#231a3a;
  font-family:"Fredoka",sans-serif;font-weight:700;font-size:2vmin;display:grid;place-items:center}
.kartu .emoji{flex:0 0 auto;font-size:4.6vmin;line-height:1;filter:drop-shadow(0 .4vmin .6vmin rgba(0,0,0,.3))}
.kartu .teks-tugas{flex:1 1 auto;min-width:0}
.kartu .nama{font-family:"Fredoka",sans-serif;font-weight:600;font-size:2.2vmin;line-height:1.2}
.kartu .kutipan{font-size:1.6vmin;color:var(--kabur);font-weight:700;font-style:italic;margin-top:.2vmin}
.kartu.selesai{background:rgba(53,217,161,.16)}
.kartu:focus-visible,.kartu.fokus{outline:none;transform:scale(1.02);
  box-shadow:0 0 0 .5vmin var(--bintang), 0 1.4vmin 2.4vmin rgba(0,0,0,.4)}
.kartu .centang{flex:0 0 auto;width:4vmin;height:4vmin;border-radius:50%;
  background:var(--daun);color:#0d3a2c;display:grid;place-items:center;font-size:2.2vmin;font-weight:900;
  transform:scale(0);transition:transform .25s cubic-bezier(.2,.8,.3,1.6)}
.kartu.selesai .centang{transform:scale(1)}
.kartu .hitung{flex:0 0 auto;font-weight:900;font-size:1.8vmin;color:var(--bintang)}
.kartu.tambah-aktivitas{justify-content:center;border-left:0!important;border:.25vmin dashed rgba(255,246,230,.3);background:rgba(255,246,230,.03)}
.kartu.tambah-aktivitas:hover{background:rgba(255,246,230,.08)}
.kartu.tambah-aktivitas .nama{color:var(--kabur)}
.lencana-tambah{flex:0 0 auto;width:4.2vmin;height:4.2vmin;border-radius:50%;background:rgba(255,246,230,.12);color:var(--susu);
  font-family:"Fredoka",sans-serif;font-weight:700;font-size:2.6vmin;display:grid;place-items:center}

.kolom-progres{display:flex;flex-direction:column;min-height:0;overflow-y:auto;align-items:center;text-align:center;gap:1vmin}
.kolom-progres>h2{align-self:center;display:flex;align-items:center;gap:.8vmin}
.kolom-progres>h2 .roket-emoji{font-size:2.6vmin;animation:melayang 3s ease-in-out infinite}
@keyframes melayang{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-.5vmin) rotate(4deg)}}
.skor-besar{display:flex;flex-direction:column;align-items:center;gap:.2vmin;margin-top:.4vmin}
.skor-besar .label-skor{font-size:1.6vmin;color:var(--kabur);font-weight:900;letter-spacing:.16em;text-transform:uppercase}
.skor-besar b{font-family:"Fredoka",sans-serif;font-size:3.6vmin;color:var(--bintang);line-height:1.1}
.skor-besar .mini-bintang{font-size:1.8vmin;letter-spacing:.2vmin;color:var(--bintang)}
.grid-jalur{display:grid;grid-template-columns:repeat(var(--kolom,6),1fr);gap:.5vmin .3vmin;width:100%;max-width:70vmin;justify-content:center;margin-top:.6vmin}
.titik{position:relative;aspect-ratio:1;width:100%;max-width:5.4vmin;justify-self:center;background:rgba(255,246,230,.14);
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  display:grid;place-items:center;font-size:1.35vmin;font-weight:900;color:var(--kabur);padding-top:6%}
.titik
